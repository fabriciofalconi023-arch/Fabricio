
name: Extrair e compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          ZIP="JuritiGamerTurbo_Shizuku_Corrigido_v3_minSdk24.zip"
          test -f "$ZIP" || { echo "ERRO: ZIP nao encontrado: $ZIP"; exit 1; }
          unzip -q "$ZIP" -d extraido

          SETTINGS="$(find extraido -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS" || { echo "ERRO: settings.gradle nao encontrado"; exit 1; }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Criar interface AIDL e corrigir servico
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          mkdir -p app/src/main/aidl/com/juriti/gamerturbo
          mkdir -p app/src/main/java/com/juriti/gamerturbo

          cat > app/src/main/aidl/com/juriti/gamerturbo/ICommandService.aidl <<'EOF'
          package com.juriti.gamerturbo;

          interface ICommandService {
              String runCommand(String command);
          }
          EOF

          cat > app/src/main/java/com/juriti/gamerturbo/CommandService.kt <<'EOF'
          package com.juriti.gamerturbo

          import java.io.BufferedReader
          import java.io.InputStreamReader

          class CommandService : ICommandService.Stub() {
              override fun runCommand(command: String): String {
                  if (command.isBlank()) return "ERRO: comando vazio."

                  return try {
                      val process = Runtime.getRuntime().exec(
                          arrayOf("sh", "-c", command)
                      )
                      val output = BufferedReader(
                          InputStreamReader(process.inputStream)
                      ).readText().trim()
                      val error = BufferedReader(
                          InputStreamReader(process.errorStream)
                      ).readText().trim()
                      val code = process.waitFor()

                      if (code == 0) {
                          output.ifBlank { "OK" }
                      } else {
                          "ERRO: ${error.ifBlank { output }}"
                      }
                  } catch (e: Throwable) {
                      "ERRO: ${e.message ?: "falha ao executar comando"}"
                  }
              }
          }
          EOF

          if [ -f app/build.gradle.kts ]; then
            cat >> app/build.gradle.kts <<'EOF'

          android {
              buildFeatures {
                  aidl = true
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          elif [ -f app/build.gradle ]; then
            cat >> app/build.gradle <<'EOF'

          android {
              buildFeatures {
                  aidl true
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
          else
            echo "ERRO: arquivo Gradle do modulo app nao encontrado"
            exit 1
          fi

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: JuritiGamerTurbo-debug
          path: extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
