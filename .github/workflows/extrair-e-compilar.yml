
name: Compilar Juriti Gamer Turbo

on:
  workflow_dispatch:
  push:
    paths:
      - 'JuritiGamerTurbo_Shizuku_Corrigido_v3_minSdk24.zip'
      - '.github/workflows/extrair-e-compilar.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        shell: bash
        run: |
          ZIP="JuritiGamerTurbo_Shizuku_Corrigido_v3_minSdk24.zip"
          test -f "$ZIP" || { echo "ZIP não encontrado"; exit 1; }
          unzip -o "$ZIP" -d extraido
          SETTINGS=$(find extraido -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS" || { echo "settings.gradle não encontrado"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Corrigir Java e Kotlin
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          cat >> app/build.gradle <<'GRADLE'

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          GRADLE

      - name: Corrigir CommandService
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          FILE="app/src/main/java/com/juriti/gamerturbo/CommandService.kt"

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/juriti/gamerturbo/CommandService.kt")
          s = p.read_text()
          s = s.replace("import android.content.Intent\n", "")
          s = s.replace("import android.os.IBinder\n", "")
          s = s.replace("    override fun onBind(intent: Intent?): IBinder = commandBinder\n", "")
          s = s.replace("    override fun onBind(intent: Intent?): IBinder = commandBinder.asBinder()\n", "")
          p.write_text(s)
          PY

          echo "CommandService.kt após a alteração:"
          cat "$FILE"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Juriti-Gamer-Turbo-APK
          path: 'extraido/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
