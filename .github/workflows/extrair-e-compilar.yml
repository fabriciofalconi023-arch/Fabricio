
name: Extrair e compilar APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        shell: bash
        run: |
          set -e
          unzip -q JuritiGamerTurbo_Shizuku_Corrigido_v3_minSdk24.zip -d extraido
          PROJECT_DIR="$(find extraido -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs dirname)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $PROJECT_DIR"

      - name: Corrigir interface AIDL e servico
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          mkdir -p app/src/main/aidl/com/juriti/gamerturbo

          cat > app/src/main/aidl/com/juriti/gamerturbo/ICommandService.aidl <<'EOF'
          package com.juriti.gamerturbo;

          interface ICommandService {
              String runCommand(String command);
          }
          EOF

          cat > app/src/main/java/com/juriti/gamerturbo/CommandService.kt <<'EOF'
          package com.juriti.gamerturbo

          import java.io.BufferedReader
          import java.io.InputStreamReader

          class CommandService : ICommandService.Stub() {
              override fun runCommand(command: String): String {
                  if (command.isBlank()) return "ERRO: comando vazio."

                  return try {
                      val process = Runtime.getRuntime().exec(
                          arrayOf("sh", "-c", command)
                      )
                      val output = BufferedReader(
                          InputStreamReader(process.inputStream)
                      ).readText().trim()
                      val error = BufferedReader(
                          InputStreamReader(process.errorStream)
                      ).readText().trim()
                      val code = process.waitFor()

                      if (code == 0) {
                          output.ifBlank { "OK" }
                      } else {
                          "ERRO: ${error.ifBlank { output }}"
                      }
                  } catch (e: Throwable) {
                      "ERRO: ${e.message ?: "falha ao executar comando"}"
                  }
              }
          }
          EOF

          cat >> app/build.gradle <<'EOF'

          android {
              buildFeatures {
                  aidl = true
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

      - name: Compilar APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: JuritiGamerTurbo-debug
          path: extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
