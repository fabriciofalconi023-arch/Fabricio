
name: Compilar Juriti Gamer Turbo

on:
  workflow_dispatch:
  push:
    paths:
      - 'JuritiGamerTurbo_Shizuku_Corrigido_v3_minSdk24.zip'
      - '.github/workflows/extrair-e-compilar.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair projeto
        shell: bash
        run: |
          ZIP="JuritiGamerTurbo_Shizuku_Corrigido_v3_minSdk24.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: ZIP não encontrado na raiz do repositório: $ZIP"
            find . -maxdepth 3 -type f
            exit 1
          fi

          unzip -o "$ZIP" -d extraido

          SETTINGS=$(find extraido -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado dentro do ZIP"
            find extraido -maxdepth 4 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Corrigir compatibilidade Java e Kotlin
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f app/build.gradle ]; then
            echo "ERRO: app/build.gradle não encontrado"
            exit 1
          fi

          cat >> app/build.gradle <<'GRADLE'

          // Compatibilidade adicionada automaticamente pelo GitHub Actions.
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          GRADLE

          echo "Configuração Java e Kotlin aplicada."

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Juriti-Gamer-Turbo-APK
          path: 'extraido/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          
