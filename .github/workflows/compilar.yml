
name: Compilar Juriti Gamer Turbo

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/compilar.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extrair ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP nao encontrado"
            exit 1
          fi
          mkdir projeto-extraido
          unzip -q "$ZIP_FILE" -d projeto-extraido

      - name: Localizar projeto
        run: |
          SETTINGS=$(find projeto-extraido -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle nao encontrado"
            find projeto-extraido -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"
          echo "Projeto localizado em $(dirname "$SETTINGS")"

      - name: Corrigir minSdk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("projeto-extraido")
          files = list(root.rglob("app/build.gradle"))
          files += list(root.rglob("app/build.gradle.kts"))

          if not files:
              raise SystemExit("ERRO: app/build.gradle nao encontrado")

          for path in files:
              content = path.read_text()
              content = re.sub(
                  r'(\bminSdk(?:Version)?\s*(?:=\s*)?)23\b',
                  r'\g<1>24',
                  content
              )
              path.write_text(content)
              print(f"Arquivo: {path}")
              for line in content.splitlines():
                  if "minSdk" in line:
                      print(line.strip())

          for path in root.rglob("AndroidManifest.xml"):
              content = path.read_text()
              content = re.sub(
                  r'(android:minSdkVersion\s*=\s*")23(")',
                  r'\g<1>24\2',
                  content
              )
              path.write_text(content)
          PY

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Juriti-Gamer-Turbo-APK
          path: projeto-extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
