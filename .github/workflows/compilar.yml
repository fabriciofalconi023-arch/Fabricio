
name: Compilar Juriti Gamer Turbo

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/compilar.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle 8.7
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Extrair ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: nenhum ZIP encontrado"
            exit 1
          fi
          mkdir projeto-extraido
          unzip -q "$ZIP_FILE" -d projeto-extraido

      - name: Localizar projeto Android
        run: |
          SETTINGS=$(find projeto-extraido -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle nao encontrado"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> "$GITHUB_ENV"

      - name: Corrigir minSdk e Java
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("projeto-extraido")
          gradle_files = list(root.rglob("app/build.gradle")) + list(root.rglob("app/build.gradle.kts"))

          if not gradle_files:
              raise SystemExit("ERRO: app/build.gradle nao encontrado")

          for path in gradle_files:
              text = path.read_text()

              # Shizuku requer Android API 24 ou superior
              text = re.sub(r'(\bminSdk(?:Version)?\s*(?:=\s*)?)23\b', r'\g<1>24', text)

              # Java 17 para combinar com Kotlin 17
              if re.search(r'compileOptions\s*\{', text):
                  if not re.search(r'sourceCompatibility\s*(?:=)?\s*JavaVersion\.VERSION_17', text):
                      text = re.sub(
                          r'(compileOptions\s*\{)',
                          r'\1\n        sourceCompatibility JavaVersion.VERSION_17',
                          text,
                          count=1
                      )
                  if not re.search(r'targetCompatibility\s*(?:=)?\s*JavaVersion\.VERSION_17', text):
                      text = re.sub(
                          r'(compileOptions\s*\{[^}]*?)(\})',
                          r'\1        targetCompatibility JavaVersion.VERSION_17\n    \2',
                          text,
                          count=1
                      )
              else:
                  text = re.sub(
                      r'(android\s*\{)',
                      r'\1\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }',
                      text,
                      count=1
                  )

              path.write_text(text)
              print(f"Configurado: {path}")

          for path in root.rglob("AndroidManifest.xml"):
              text = path.read_text()
              text = re.sub(r'(android:minSdkVersion\s*=\s*")23(")', r'\g<1>24\2', text)
              path.write_text(text)
          PY

      
      - name: Corrigir atalhos e verificar Shizuku
        run: |
          FILE="$PROJECT_DIR/app/src/main/java/com/juriti/gamerturbo/MainActivity.kt"
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          s = s.replace(
              "Settings.ACTION_BATTERY_USAGE_SUMMARY",
              "Settings.ACTION_BATTERY_SAVER_SETTINGS"
          )
          s = s.replace(
              "Settings.ACTION_STORAGE_SETTINGS",
              "Settings.ACTION_INTERNAL_STORAGE_SETTINGS"
          )

          p.write_text(s)
          print("Atalhos de bateria e armazenamento corrigidos.")
          PY

          echo "===== SHIZUKU NO CODIGO ====="
          grep -n -E 'newProcess|UserService|ShizukuRemoteProcess|runShell' "$FILE" || true
          echo "===== VERSAO DA BIBLIOTECA ====="
          grep -R -n 'shizuku.*api' "$PROJECT_DIR" --include='*.gradle' --include='*.gradle.kts' || true
          
      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Juriti-Gamer-Turbo-APK
          path: projeto-extraido/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
