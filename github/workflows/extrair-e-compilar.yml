name: Compilar Juriti Gamer Turbo

on:
workflow_dispatch:
push:
paths:
- "JuritiGamerTurbo_Shizuku_UserService_Corrigido.zip"
- ".github/workflows/extrair-e-compilar.yml"

jobs:
build:
name: Gerar APK Juriti Gamer Turbo
runs-on: ubuntu-latest

```
steps:
  - name: Baixar projeto do GitHub
    uses: actions/checkout@v4

  - name: Configurar Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Extrair projeto Juriti Gamer Turbo
    shell: bash
    run: |
      set -euo pipefail

      ZIP="JuritiGamerTurbo_Shizuku_UserService_Corrigido.zip"

      if [ ! -f "$ZIP" ]; then
        echo "ERRO: arquivo $ZIP não encontrado na raiz do repositório."
        exit 1
      fi

      mkdir -p extraido
      unzip -q "$ZIP" -d extraido

      SETTINGS=$(find extraido -type f \( \
        -name settings.gradle -o \
        -name settings.gradle.kts \
        \) -print -quit)

      if [ -z "$SETTINGS" ]; then
        echo "ERRO: arquivo settings.gradle não encontrado."
        find extraido -maxdepth 5 -type f | head -100
        exit 1
      fi

      PROJECT_DIR="$(dirname "$SETTINGS")"

      echo "Projeto encontrado em: $PROJECT_DIR"
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Verificar código do projeto
    shell: bash
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"

      echo "Pasta: $PWD"
      echo "Procurando chamadas newProcess:"
      grep -R -n "newProcess" app/src 2>/dev/null || true

  - name: Compilar APK Debug
    shell: bash
    run: |
      set -o pipefail
      cd "$PROJECT_DIR"
      gradle :app:assembleDebug --stacktrace

  - name: Disponibilizar APK para download
    if: success()
    uses: actions/upload-artifact@v4
    with:
      name: Juriti-Gamer-Turbo-APK
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
```
